server:
  port: 8080

spring:
  application:
    name: procurement-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/BUY?currentSchema=procurement
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
  global-config:
    banner: false
    db-config:
      id-type: auto

procurement:
  ai-agent:
    base-url: http://localhost:8000
  upload-dir: ./uploads

logging:
  level:
    com.smartprocurement: INFO
